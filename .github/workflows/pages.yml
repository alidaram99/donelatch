name: Publish DoneLatch website
on:
  push:
    branches: [main]
    paths: ['docs/**', 'llms.txt', 'scripts/indexnow.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: cp llms.txt docs/llms.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Notify IndexNow after page and scoped key are live
        continue-on-error: true
        run: node scripts/indexnow.mjs
